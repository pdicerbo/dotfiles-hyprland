gui:
  theme:
    authorColors:
      'Pierluigi Di Cerbo': 'blue'
git:
  autoStageResolvedConflicts: false
  commit:
    autoWrapCommitMessage: false
  mainBranches:
    - master
  autoFetch: false
  autoRefresh: false
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --author-date-order {{branchName}} --oneline
  log:
    order: "author-date-order"
    showWholeGraph: true
  autoForwardBranches: none
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --side-by-side
customCommands:
  - key: '<f1>'
    description: "Pull from a specific remote repository"
    context: 'global'
    loadingText: 'Pulling ...'
    command: git pull {{ .Form.Remote }} {{ .Form.RemoteBranch }}
    prompts:
      - type: 'input'
        key: 'Remote'
        title: "Remote:"
        suggestions:
          preset: 'remotes'
      - type: 'input'
        key: 'RemoteBranch'
        title: "Remote branch:"
        suggestions:
          command: "git branch --remote --list '{{.Form.Remote}}/*' --format='%(refname:short)' | sed 's/{{.Form.Remote}}\\///'"
  - key: '<c-p>'
    description: "Push to a specific remote repository"
    context: 'global'
    loadingText: 'Pushing ...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Which remote repository to push to?'
        command: bash -c "git remote --verbose | grep '/.* (push)'"
        filter: '(?P<remote>.*)\s+(?P<url>.*) \(push\)'
        valueFormat: '{{ .remote }}'
        labelFormat: '{{ .remote | bold | cyan }} {{ .url }}'
      - type: 'menu'
        title: 'How to push?'
        options:
          - value: 'push'
          - value: 'push --force-with-lease'
          - value: 'push --force'
    command: "git {{index .PromptResponses 1}} {{index .PromptResponses 0}}"
  - key: '<c-d>'
    description: 'fetch a remote branch'
    command: git fetch {{ .Form.Remote }} {{ .Form.RemoteBranch }}
    context: 'global'
    prompts:
      - type: 'input'
        key: 'Remote'
        title: "Fetch from Remote:"
        suggestions:
          preset: 'remotes'
      - type: 'input'
        key: 'RemoteBranch'
        title: "Fetch Remote branch:"
        suggestions:
          command: "git branch --remote --list '{{.Form.Remote}}/*' --format='%(refname:short)' | sed 's/{{.Form.Remote}}\\///'"
    loadingText: 'Fetching branch...'
  - key: '<c-b>'
    description: 'Show which branches contain this commit'
    context: 'commits'
    output: popup
    outputTitle: "Commit's branch membership"
    command: >-
      printf '\033[1;36m== In current branch (HEAD)? ==\033[0m\n';
      git merge-base --is-ancestor {{.SelectedLocalCommit.Hash}} HEAD && printf '\033[1;32mYES\033[0m\n' || printf '\033[1;31mNO\033[0m\n';
      printf '\n\033[1;32m== Branches CONTAINING it ==\033[0m\n';
      git branch --color=always -a --contains {{.SelectedLocalCommit.Hash}};
      printf '\n\033[1;31m== Branches NOT containing it ==\033[0m\n';
      git branch --color=always -a --no-contains {{.SelectedLocalCommit.Hash}}
